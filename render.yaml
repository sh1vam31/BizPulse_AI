services:
  - type: web
    name: bizpulse-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
